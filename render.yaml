services:
  # 1. Go REST Backend API
  - type: web
    name: mistake-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    autoDeploy: false
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: mistake-db
          property: connectionString

  # 2. Next.js Web Frontend Dashboard
  - type: web
    name: mistake-web
    runtime: docker
    dockerfilePath: web/Dockerfile
    dockerContext: web
    autoDeploy: false
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: API_URL
        value: http://mistake-backend:8080/api/v1

databases:
  # 3. Render Managed PostgreSQL Database
  - name: mistake-db
    plan: free
    region: oregon
    databaseName: mistake
    user: mistake_user
